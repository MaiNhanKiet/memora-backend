syntax = "proto3";

package memora.personalization.v1;

import "common/v1/actor.proto";

// Hosted by operations-service. Plan: docs/plans/active/operations-personalization.md
// (PERSO-001..003, approved 2026-11-15). The Gateway checks CONSENT_MANAGE_OWN and
// fills `actor`; Operations checks resource ownership.
service ConsentService {
  rpc AcceptConsent (AcceptConsentRequest) returns (Consent);
  rpc ListConsents (ListConsentsRequest) returns (ListConsentsResponse);
  rpc RevokeConsent (RevokeConsentRequest) returns (Consent);
}

// PERSO-005/006/008 (approved 2026-11-15). The Gateway checks SOURCE_CAPTURE.
// Device attempts (PERSO-007) arrive over MQTT inside Operations, not gRPC.
service FingerprintCaptureService {
  rpc CreateCaptureSession (CreateCaptureSessionRequest) returns (CaptureSession);
  rpc GetCaptureSession (GetCaptureSessionRequest) returns (CaptureSession);
  rpc CompleteCaptureSession (CompleteCaptureSessionRequest) returns (CaptureSession);
  // PERSO-026 / PERSO-027: the capture staff reviews each PENDING_REVIEW attempt.
  rpc GetCaptureAttemptImage (GetCaptureAttemptImageRequest) returns (CaptureAttemptImage);
  rpc RejectCaptureAttempt (RejectCaptureAttemptRequest) returns (CaptureSession);
  // PERSO-028 / PERSO-029 (2026-11-17): ask the device for another scan, or end without picking.
  rpc NextCaptureAttempt (NextCaptureAttemptRequest) returns (CaptureSession);
  rpc CloseCaptureSession (CloseCaptureSessionRequest) returns (CaptureSession);
}

// PERSO-011 (approved 2026-11-19). The Gateway checks DESIGN_SUBMIT_OWN and fills `actor`;
// Operations checks that the caller owns the order. Never returns keys, checksums or metadata.
service PersonalizationSourceService {
  rpc ListOrderSources (ListOrderSourcesRequest) returns (ListOrderSourcesResponse);
  // PERSO-012 (approved 2026-11-19). Owner only; a foreign, missing or DELETED source is NOT_FOUND.
  rpc GetSourceProcessing (GetSourceProcessingRequest) returns (SourceProcessing);
  // PERSO-032..034 (approved 2026-11-23). Owner only; foreign, missing or DELETED is NOT_FOUND; not a READY SOUNDWAVE is ALREADY_EXISTS (SOURCE_NOT_READY).
  rpc GetSoundwaveWavecode (GetSoundwaveWavecodeRequest) returns (SoundwaveWavecode);
  // ALREADY_EXISTS WAVECODE_STYLE_LOCKED after accept; UNAVAILABLE PROCESSING_WORKER_UNAVAILABLE when the worker is needed and down.
  rpc SelectWavecodeStyle (SelectWavecodeStyleRequest) returns (SoundwaveWavecode);
  rpc AcceptWavecodeStyle (AcceptWavecodeStyleRequest) returns (SoundwaveWavecode);
  // PERSO-035 (approved 2026-11-23). Pick another 3 s segment without re-uploading; the source goes back to ACCEPTED and is processed again.
  rpc ResegmentSoundwaveSource (ResegmentSoundwaveSourceRequest) returns (SoundwaveWavecode);
}

message ResegmentSoundwaveSourceRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string source_id = 2;
  // >= 0; segment_start_ms + 3000 <= audio duration.
  int32 segment_start_ms = 3;
  // CLASSIC | HAIRLINE | OSCILLOSCOPE. Unset or empty keeps the current style.
  optional string wavecode_style = 4;
}

message GetSoundwaveWavecodeRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string source_id = 2;
}

message SelectWavecodeStyleRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string source_id = 2;
  // CLASSIC | HAIRLINE | OSCILLOSCOPE
  string style = 3;
}

message AcceptWavecodeStyleRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string source_id = 2;
  // Unset or empty means the current style.
  optional string style = 3;
}

message WavecodeStyleState {
  string code = 1;
  string name = 2;
  bool generated = 3;
  // 300 s presigned GET URLs; credentials, never log them. Unset unless generated.
  optional string preview_svg_url = 4;
  optional string preview_png_url = 5;
}

// Never carries object keys or checksums.
message SoundwaveWavecode {
  string current_style = 1;
  optional string accepted_style = 2;
  repeated WavecodeStyleState styles = 3;
  // PENDING | ACCEPTED | PROCESSING | READY | PROCESSING_FAILED
  string status = 4;
  optional string failure_code = 5;
  // Worker-measured duration when known, else the declared one.
  optional int32 duration_ms = 6;
  optional int32 segment_start_ms = 7;
  int32 segment_duration_ms = 8;
  // 300 s presigned GET URLs; credentials, never log them.
  optional string raw_audio_url = 9;
  optional string segment_audio_url = 10;
}

message Consent {
  string consent_id = 1;
  string order_id = 2;
  // FINGERPRINT_PROCESSING | SOUNDWAVE_PROCESSING
  string consent_type = 3;
  string policy_version = 4;
  // ACCEPTED | REVOKED
  string status = 5;
  // ISO-8601 UTC.
  string accepted_at = 6;
  // ISO-8601 UTC; unset while ACCEPTED.
  optional string revoked_at = 7;
  repeated string ring_item_ids = 8;
}

message AcceptConsentRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string consent_type = 3;
  string policy_version = 4;
  repeated string ring_item_ids = 5;
}

message ListConsentsRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
}

message ListConsentsResponse {
  repeated Consent items = 1;
}

message RevokeConsentRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string consent_id = 3;
}

message CaptureAttemptSummary {
  int32 attempt_no = 1;
  // PENDING_REVIEW | ACCEPTED | REJECTED | ERROR
  string result = 2;
  optional double quality_score = 3;
  // ISO-8601 UTC.
  string attempted_at = 4;
  // PASS | LOW_QUALITY: threshold suggestion only; the staff decides.
  optional string suggestion = 5;
  // Only for REJECTED / ERROR: CAPTURE_FAILED | STAFF_REJECTED | NOT_SELECTED | EXPIRED.
  optional string failure_reason = 6;
}

message CaptureSession {
  string session_id = 1;
  string order_id = 2;
  string consent_id = 3;
  string device_code = 4;
  // CREATED | IN_PROGRESS | COMPLETED | FAILED | CANCELLED | EXPIRED
  string status = 5;
  int32 attempt_count = 6;
  int32 max_attempts = 7;
  // ISO-8601 UTC.
  string expires_at = 8;
  string created_at = 9;
  // Set once COMPLETED.
  optional string accepted_source_id = 10;
  repeated CaptureAttemptSummary attempts = 11;
}

message CreateCaptureSessionRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string consent_id = 3;
  string device_code = 4;
}

message GetCaptureSessionRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string session_id = 2;
}

message CompleteCaptureSessionRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string session_id = 2;
  // The PENDING_REVIEW attempt the staff accepts.
  int32 attempt_no = 3;
}

message GetCaptureAttemptImageRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string session_id = 2;
  int32 attempt_no = 3;
}

message CaptureAttemptImage {
  int32 attempt_no = 1;
  // Presigned GET URL, valid 60 s. Never log it.
  string image_url = 2;
  // ISO-8601 UTC.
  string expires_at = 3;
  string content_type = 4;
}

message RejectCaptureAttemptRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string session_id = 2;
  int32 attempt_no = 3;
}

message NextCaptureAttemptRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string session_id = 2;
}

message CloseCaptureSessionRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string session_id = 2;
}

message PersonalizationSource {
  string source_id = 1;
  // FINGERPRINT | SOUNDWAVE
  string source_type = 2;
  // PENDING | ACCEPTED | PROCESSING | READY | PROCESSING_FAILED
  string status = 3;
  // From metadata_json.failureCode; unset until a processing job records one.
  optional string failure_code = 4;
  // ISO-8601 UTC; unset while not accepted.
  optional string accepted_at = 5;
  // Ring Items of the order with an active binding to this source.
  repeated string ring_item_ids = 6;
  // N/A | SHARED | SEPARATE; unset while the source has no active binding.
  optional string binding_mode = 7;
}

message ListOrderSourcesRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
}

message ListOrderSourcesResponse {
  repeated PersonalizationSource items = 1;
}

message GetSourceProcessingRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string source_id = 2;
}

// Never carries object keys, checksums, artwork or wavecode.
message SourceProcessing {
  string source_id = 1;
  // FINGERPRINT | SOUNDWAVE
  string source_type = 2;
  // ACCEPTED | PROCESSING | READY | PROCESSING_FAILED
  string status = 3;
  optional string failure_code = 4;
  // ISO-8601 UTC; unset until the job starts.
  optional string started_at = 5;
  // ISO-8601 UTC; unset until READY or PROCESSING_FAILED.
  optional string finished_at = 6;
}

// PERSO-009 / PERSO-010 (approved 2026-11-19). The Gateway checks SOURCE_AUDIO_UPLOAD_OWN and fills `actor`.
// The response never carries object keys, checksums or metadata; `upload_url` is a credential, never log it.
service SoundwaveUploadService {
  rpc InitiateSoundwaveUpload (InitiateSoundwaveUploadRequest) returns (InitiateSoundwaveUploadResponse);
  rpc CompleteSoundwaveUpload (CompleteSoundwaveUploadRequest) returns (CompleteSoundwaveUploadResponse);
  // PERSO-031 (approved 2026-11-23). Public read, no actor. Operations asks the processing worker and caches the answer.
  rpc ListSoundwaveStyles (ListSoundwaveStylesRequest) returns (ListSoundwaveStylesResponse);
}

message InitiateSoundwaveUploadRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string consent_id = 3;
  // audio/wav | audio/mpeg | audio/mp4 | audio/aac
  string content_type = 4;
  // 1..10485760
  int32 size_bytes = 5;
  // 64 hex characters.
  string sha256 = 6;
  // UPLOAD | IN_APP_RECORDING
  string origin = 7;
  // 3000..30000, measured by the client.
  int32 duration_ms = 8;
}

message InitiateSoundwaveUploadResponse {
  // The new personalization source id.
  string upload_id = 1;
  string upload_url = 2;
  map<string, string> upload_headers = 3;
  // ISO-8601 UTC.
  string expires_at = 4;
}

message CompleteSoundwaveUploadRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string upload_id = 3;
  // >= 0 and segment_start_ms + 3000 <= duration_ms.
  int32 segment_start_ms = 4;
  // CLASSIC | HAIRLINE | OSCILLOSCOPE. Unset or empty means CLASSIC. Stored in metadata_json.
  optional string wavecode_style = 5;
}

message ListSoundwaveStylesRequest {}

message SoundwaveStyle {
  // CLASSIC | HAIRLINE | OSCILLOSCOPE
  string code = 1;
  string name = 2;
  string description = 3;
  // BAR_HEIGHT | PEAK_HEIGHT
  string decoder = 4;
  // Small preview SVG supplied by the worker.
  string sample_svg = 5;
}

message ListSoundwaveStylesResponse {
  string default_style = 1;
  repeated SoundwaveStyle styles = 2;
}

message CompleteSoundwaveUploadResponse {
  string source_id = 1;
  // SOUNDWAVE
  string source_type = 2;
  // ACCEPTED | PROCESSING | READY | PROCESSING_FAILED
  string status = 3;
}
