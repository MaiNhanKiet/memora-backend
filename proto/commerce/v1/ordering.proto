syntax = "proto3";

package memora.commerce.v1;

import "common/v1/actor.proto";

service OrderingService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrderById (GetOrderByIdRequest) returns (GetOrderByIdResponse);
  rpc GetOrderTimeline (GetOrderTimelineRequest) returns (GetOrderTimelineResponse);
  rpc GetRingItemDetails (GetRingItemDetailsRequest) returns (GetRingItemDetailsResponse);
  rpc ListAdminOrders (ListAdminOrdersRequest) returns (ListAdminOrdersResponse);
  rpc GetAdminOrderDetails (GetAdminOrderDetailsRequest) returns (GetAdminOrderDetailsResponse);
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
  rpc ListRingItemVersions (ListRingItemVersionsRequest) returns (ListRingItemVersionsResponse);
  rpc UpdateCurrentRingItemVersion (UpdateCurrentRingItemVersionRequest) returns (UpdateCurrentRingItemVersionResponse);
  rpc ListOrderQuotes (ListOrderQuotesRequest) returns (ListOrderQuotesResponse);
  rpc GetOrderPersonalizationContext (GetOrderPersonalizationContextRequest) returns (GetOrderPersonalizationContextResponse);
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
  rpc CreateFinalQuote (CreateFinalQuoteRequest) returns (FullQuoteDetail);
  rpc UpdateFinalQuote (UpdateFinalQuoteRequest) returns (FullQuoteDetail);
  rpc PublishFinalQuote (PublishFinalQuoteRequest) returns (FullQuoteDetail);
  rpc GetOrderQuoteById (GetOrderQuoteByIdRequest) returns (FullQuoteDetail);
  rpc ConfirmFinalQuote (ConfirmFinalQuoteRequest) returns (ConfirmFinalQuoteResponse);
  rpc RejectFinalQuote (RejectFinalQuoteRequest) returns (RejectFinalQuoteResponse);
  rpc GetOrderFinalConfirmations (GetOrderFinalConfirmationsRequest) returns (GetOrderFinalConfirmationsResponse);
  rpc ListOrderPayments (ListOrderPaymentsRequest) returns (ListOrderPaymentsResponse);
  rpc GetOrderPaymentById (GetOrderPaymentByIdRequest) returns (PaymentTransactionDetail);
  rpc GetPaymentReceipt (GetPaymentReceiptRequest) returns (PaymentReceiptDetail);
  rpc GetOrderInvoice (GetOrderInvoiceRequest) returns (OrderInvoiceDetail);
  rpc CreateRefundRequest (CreateRefundRequestMessage) returns (CreateRefundResponse);
}

message OrderPreP1Acknowledgement {
  string notice_version = 1;
  bool privacy_notice_acknowledged = 2;
  bool p1_nonrefund_acknowledged = 3;
}

message CreateOrderRequest {
  memora.common.v1.VerifiedActor actor = 1;
  repeated string selected_draft_ids = 2;
  string fulfillment_mode = 3;
  string recipient_name = 4;
  string recipient_phone = 5;
  string recipient_email = 6;
  string delivery_address_json = 7;
  string source_plan_mode = 8;
  OrderPreP1Acknowledgement pre_p1_acknowledgement = 9;
}

message CreateOrderResponse {
  string order_id = 1;
  string order_no = 2;
  string status = 3;
  string source_plan_mode = 4;
  int32 items_count = 5;
  double total_amount = 6;
  double deposit_amount = 7;
  string currency = 8;
  string created_at = 9;
}

message ListOrdersRequest {
  memora.common.v1.VerifiedActor actor = 1;
  int32 page = 2;
  int32 limit = 3;
  string status = 4;
}

message OrderSummaryItem {
  string id = 1;
  string order_no = 2;
  string status = 3;
  string source_plan_mode = 4;
  int32 items_count = 5;
  double total_amount = 6;
  string currency = 7;
  string recipient_name = 8;
  string created_at = 9;
  string updated_at = 10;
}

message ListOrdersResponse {
  repeated OrderSummaryItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetOrderByIdRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
}

message OrderQuoteSummary {
  string quote_id = 1;
  string quote_no = 2;
  string quote_type = 3;
  double subtotal_amount = 4;
  double delivery_amount = 5;
  double adjustment_amount = 6;
  double total_amount = 7;
  string currency = 8;
  string status = 9;
}

message RingItemSummary {
  string id = 1;
  int32 item_no = 2;
  string source_ring_design_draft_id = 3;
  string current_version_id = 4;
  int32 version_no = 5;
  string template_variant_id = 6;
  string template_code = 7;
  string template_name = 8;
  string material_name = 9;
  double target_size = 10;
  string personalization_package = 11;
  bool memory_enabled = 12;
}

message GetOrderByIdResponse {
  string id = 1;
  string order_no = 2;
  string status = 3;
  string source_plan_mode = 4;
  string fulfillment_mode = 5;
  string recipient_name = 6;
  string recipient_phone = 7;
  string recipient_email = 8;
  string delivery_address_json = 9;
  OrderQuoteSummary current_quote = 10;
  repeated RingItemSummary items = 11;
  string created_at = 12;
  string updated_at = 13;
}

message GetOrderTimelineRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
}

message TimelineEventItem {
  string event_type = 1;
  string title = 2;
  string description = 3;
  string occurred_at = 4;
  string status = 5;
}

message StageGateItem {
  string stage_code = 1;
  string stage_name = 2;
  string status = 3; // PENDING, ACTIVE, COMPLETED, SKIPPED
  bool is_current = 4;
  string completed_at = 5;
}

message GetOrderTimelineResponse {
  string order_id = 1;
  string order_no = 2;
  string current_status = 3;
  repeated TimelineEventItem events = 4;
  repeated StageGateItem stage_gates = 5;
}

message GetRingItemDetailsRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string ring_item_id = 3;
}

message RingItemGemstoneDetail {
  int32 slot_number = 1;
  string gemstone_slot_id = 2;
  string gemstone_option_id = 3;
  string gemstone_type = 4;
  string gemstone_name = 5;
  string shape = 6;
  double carat_weight = 7;
  string color = 8;
  string clarity = 9;
}

message GetRingItemDetailsResponse {
  string id = 1;
  string order_id = 2;
  int32 item_no = 3;
  string source_ring_design_draft_id = 4;
  string current_version_id = 5;
  int32 version_no = 6;
  string template_variant_id = 7;
  string template_code = 8;
  string template_name = 9;
  string material_name = 10;
  double target_size = 11;
  string personalization_package = 12;
  bool memory_enabled = 13;
  repeated RingItemGemstoneDetail gemstones = 14;
  string created_at = 15;
}

// -----------------------------------------------------------------------------
// Admin Order Messages
// -----------------------------------------------------------------------------

message ListAdminOrdersRequest {
  int32 page = 1;
  int32 limit = 2;
  string status = 3;
  string search = 4;
  string date_from = 5;
  string date_to = 6;
}

message AdminOrderSummaryItem {
  string id = 1;
  string order_no = 2;
  string status = 3;
  string source_plan_mode = 4;
  string owner_customer_identity_id = 5;
  string recipient_name = 6;
  string recipient_phone = 7;
  string recipient_email = 8;
  int32 items_count = 9;
  double total_amount = 10;
  string currency = 11;
  string created_at = 12;
  string updated_at = 13;
}

message ListAdminOrdersResponse {
  repeated AdminOrderSummaryItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetAdminOrderDetailsRequest {
  string order_id = 1;
}

message AdminCustomerInfo {
  string customer_identity_id = 1;
  string guest_email = 2;
  string guest_phone = 3;
  string guest_email_verified_at = 4;
}

message GetAdminOrderDetailsResponse {
  string id = 1;
  string order_no = 2;
  string status = 3;
  string source_plan_mode = 4;
  string fulfillment_mode = 5;
  AdminCustomerInfo customer = 6;
  string recipient_name = 7;
  string recipient_phone = 8;
  string recipient_email = 9;
  string delivery_address_json = 10;
  string pre_p1_evidence_json = 11;
  OrderQuoteSummary current_quote = 12;
  repeated RingItemSummary items = 13;
  string cancelled_at = 14;
  string cancellation_reason = 15;
  string created_at = 16;
  string updated_at = 17;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  string target_status = 2;
  string reason = 3;
  string staff_user_id = 4;
}

message UpdateOrderStatusResponse {
  string order_id = 1;
  string order_no = 2;
  string previous_status = 3;
  string current_status = 4;
  string updated_at = 5;
}

// -----------------------------------------------------------------------------
// Ring Item Versions & Quotes Messages
// -----------------------------------------------------------------------------

message ListRingItemVersionsRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string ring_item_id = 3;
}

message RingItemVersionSummary {
  string id = 1;
  int32 version_no = 2;
  string status = 3;
  double target_size = 4;
  string personalization_package = 5;
  bool memory_enabled = 6;
  string change_reason = 7;
  string template_variant_id = 8;
  string template_code = 9;
  string template_name = 10;
  string material_name = 11;
  repeated RingItemGemstoneDetail gemstones = 12;
  string created_at = 13;
}

message ListRingItemVersionsResponse {
  string ring_item_id = 1;
  string order_id = 2;
  repeated RingItemVersionSummary versions = 3;
}

message RingItemGemstoneInput {
  int32 slot_number = 1;
  string gemstone_option_id = 2;
}

message UpdateCurrentRingItemVersionRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string ring_item_id = 3;
  double target_size = 4;
  string change_reason = 5;
  bool memory_enabled = 6;
  repeated RingItemGemstoneInput gemstone_selections = 7;
}

message UpdateCurrentRingItemVersionResponse {
  string ring_item_id = 1;
  string version_id = 2;
  int32 version_no = 3;
  string status = 4;
  double target_size = 5;
  string change_reason = 6;
  string updated_at = 7;
}

message ListOrderQuotesRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
}

message QuoteLineItem {
  string id = 1;
  string component_type = 2;
  string description = 3;
  double quantity = 4;
  double unit_amount = 5;
  double line_amount = 6;
  string price_source_type = 7;
  string ring_item_id = 8;
}

message FullQuoteDetail {
  string id = 1;
  string quote_no = 2;
  string quote_type = 3;
  int32 version_no = 4;
  string status = 5;
  double subtotal_amount = 6;
  double delivery_amount = 7;
  double adjustment_amount = 8;
  double total_amount = 9;
  string currency = 10;
  repeated QuoteLineItem items = 11;
  string created_at = 12;
  string valid_until = 13;
  string issued_at = 14;
  string accepted_at = 15;
}

message ListOrderQuotesResponse {
  string order_id = 1;
  repeated FullQuoteDetail quotes = 2;
}

// -----------------------------------------------------------------------------
// Order Cancellation Messages
// -----------------------------------------------------------------------------

message CancelOrderRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string reason = 3;
}

message CancelOrderResponse {
  string order_id = 1;
  string status = 2;
  string cancelled_at = 3;
  string cancellation_reason = 4;
}

// -----------------------------------------------------------------------------
// Final Quotes & Management Messages
// -----------------------------------------------------------------------------

message QuoteLineItemInput {
  string ring_item_id = 1;
  string component_type = 2;
  string description = 3;
  double quantity = 4;
  double unit_amount = 5;
  double line_amount = 6;
  string price_source_type = 7;
}

message CreateFinalQuoteRequest {
  string order_id = 1;
  double subtotal_amount = 2;
  double delivery_amount = 3;
  double adjustment_amount = 4;
  double total_amount = 5;
  string currency = 6;
  string valid_until = 7;
  string staff_user_id = 8;
  repeated QuoteLineItemInput items = 9;
}

message UpdateQuoteLineItemInput {
  string id = 1;
  string ring_item_id = 2;
  string component_type = 3;
  string description = 4;
  double quantity = 5;
  double unit_amount = 6;
  double line_amount = 7;
  string price_source_type = 8;
}

message UpdateFinalQuoteRequest {
  string order_id = 1;
  string quote_id = 2;
  double subtotal_amount = 3;
  double delivery_amount = 4;
  double adjustment_amount = 5;
  double total_amount = 6;
  string valid_until = 7;
  string staff_user_id = 8;
  repeated UpdateQuoteLineItemInput items = 9;
}

message PublishFinalQuoteRequest {
  string order_id = 1;
  string quote_id = 2;
  string staff_user_id = 3;
}

message GetOrderQuoteByIdRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string quote_id = 3;
}

message ConfirmFinalQuoteRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string quote_id = 3;
  string notes = 4;
}

message FinalConfirmationItemSummary {
  string id = 1;
  string ring_item_id = 2;
  string ring_item_version_id = 3;
  int32 version_no = 4;
}

message ConfirmFinalQuoteResponse {
  string confirmation_id = 1;
  string order_id = 2;
  string quote_id = 3;
  string status = 4;
  string confirmed_at = 5;
  string next_order_status = 6;
  repeated FinalConfirmationItemSummary items = 7;
}

message RejectFinalQuoteRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string quote_id = 3;
  string reason = 4;
}

message RejectFinalQuoteResponse {
  string order_id = 1;
  string quote_id = 2;
  string status = 3;
  string reason = 4;
  string updated_order_status = 5;
}

message GetOrderFinalConfirmationsRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
}

message FinalConfirmationDetail {
  string id = 1;
  string order_id = 2;
  string quote_id = 3;
  string quote_no = 4;
  double quote_total_amount = 5;
  string confirmed_by_customer_identity_id = 6;
  string status = 7;
  string confirmed_at = 8;
  string invalidated_at = 9;
  string invalidation_reason = 10;
  repeated FinalConfirmationItemSummary items = 11;
}

message GetOrderFinalConfirmationsResponse {
  string order_id = 1;
  repeated FinalConfirmationDetail confirmations = 2;
}

// -----------------------------------------------------------------------------
// Cross-Service Operations Messages
// -----------------------------------------------------------------------------

message GetOrderPersonalizationContextRequest {
  string order_id = 1;
}

message PersonalizationRingItem {
  string ring_item_id = 1;
  int32 item_no = 2;
  string current_version_id = 3;
  string personalization_package = 4;
  string version_status = 5;
}

message GetOrderPersonalizationContextResponse {
  string order_id = 1;
  string owner_customer_identity_id = 2;
  string status = 3;
  bool p1_paid = 4;
  string source_plan_mode = 5;
  repeated PersonalizationRingItem ring_items = 6;
}

// -----------------------------------------------------------------------------
// Payment Transactions, Receipts & Invoices Messages
// -----------------------------------------------------------------------------

message ListOrderPaymentsRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
}

message PaymentTransactionSummary {
  string id = 1;
  string order_id = 2;
  string payment_stage = 3;
  string transaction_type = 4;
  double amount = 5;
  string currency = 6;
  string status = 7;
  string provider = 8;
  string payment_method = 9;
  string requested_at = 10;
  string completed_at = 11;
  string receipt_no = 12;
}

message ListOrderPaymentsResponse {
  string order_id = 1;
  double total_paid_amount = 2;
  string currency = 3;
  repeated PaymentTransactionSummary payments = 4;
}

message GetOrderPaymentByIdRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string transaction_id = 3;
}

message PaymentTransactionDetail {
  string id = 1;
  string order_id = 2;
  string payment_stage = 3;
  string transaction_type = 4;
  double amount = 5;
  string currency = 6;
  string status = 7;
  string provider = 8;
  string payment_method = 9;
  string provider_order_code = 10;
  string provider_transaction_id = 11;
  string provider_reference = 12;
  string related_transaction_id = 13;
  string requested_at = 14;
  string completed_at = 15;
  string failed_at = 16;
  string failure_reason = 17;
  string receipt_no = 18;
  string receipt_issued_at = 19;
  string metadata_json = 20;
}

message GetPaymentReceiptRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
  string transaction_id = 3;
}

message PaymentReceiptDetail {
  string receipt_no = 1;
  string transaction_id = 2;
  string order_id = 3;
  string order_no = 4;
  string payment_stage = 5;
  double amount = 6;
  string currency = 7;
  string payment_method = 8;
  string completed_at = 9;
  string recipient_name = 10;
  string issued_at = 11;
}

message GetOrderInvoiceRequest {
  memora.common.v1.VerifiedActor actor = 1;
  string order_id = 2;
}

message InvoiceItemSummary {
  string component_type = 1;
  string description = 2;
  double quantity = 3;
  double unit_amount = 4;
  double line_amount = 5;
}

message InvoicePaymentRecord {
  string payment_stage = 1;
  double amount = 2;
  string completed_at = 3;
  string receipt_no = 4;
}

message OrderInvoiceDetail {
  string invoice_no = 1;
  string order_id = 2;
  string order_no = 3;
  string status = 4;
  string issued_at = 5;
  double total_amount = 6;
  double total_paid_amount = 7;
  double remaining_amount = 8;
  string currency = 9;
  string recipient_name = 10;
  string recipient_phone = 11;
  string delivery_address_json = 12;
  repeated InvoiceItemSummary items = 13;
  repeated InvoicePaymentRecord payment_transactions = 14;
}

message CreateRefundRequestMessage {
  string transaction_id = 1;
  double refund_amount = 2;
  string reason = 3;
  string notes = 4;
  string staff_user_id = 5;
}

message CreateRefundResponse {
  string refund_transaction_id = 1;
  string original_transaction_id = 2;
  string order_id = 3;
  double refund_amount = 4;
  string currency = 5;
  string status = 6;
  string requested_at = 7;
  string reason = 8;
}



