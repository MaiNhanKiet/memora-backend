name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true
  REDIS_PASSWORD: ci-redis-pass-ok16
  IAM_REDIS_HOST: 127.0.0.1
  IAM_REDIS_PORT: '6379'
  IAM_REDIS_PASSWORD: ci-redis-pass-ok16
  IAM_REDIS_DB: '0'
  CACHE_REDIS_HOST: 127.0.0.1
  CACHE_REDIS_PORT: '6379'
  CACHE_REDIS_PASSWORD: ci-redis-pass-ok16
  CACHE_REDIS_DB: '1'
  QUEUE_REDIS_HOST: 127.0.0.1
  QUEUE_REDIS_PORT: '6379'
  QUEUE_REDIS_PASSWORD: ci-redis-pass-ok16
  QUEUE_REDIS_DB: '2'
  IAM_DATABASE_URL: postgresql://memora_ci:memora_ci_pg@127.0.0.1:5432/memora_ci?schema=iam

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    # Three extra linux/amd64 image builds each run npm ci on a cold runner.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: memora_ci
          POSTGRES_PASSWORD: memora_ci_pg
          POSTGRES_DB: memora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memora_ci -d memora_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start CI Redis
        run: |
          docker run -d --name memora-ci-redis -p 6379:6379 redis:7-alpine \
            redis-server --requirepass "$REDIS_PASSWORD" --appendonly no --maxmemory-policy noeviction
          for i in $(seq 1 20); do
            if docker exec memora-ci-redis redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "CI Redis did not become ready" >&2
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Engineering kit
        run: |
          npm run kit:validate
          npm run boundaries
          npm run ci:deploy-layout

      - name: Load gRPC protos
        run: npm run proto:check

      - name: Prisma validate and generate
        env:
          COMMERCE_DATABASE_URL: postgresql://prisma_generate:unused@127.0.0.1:1/prisma_generate
          OPERATIONS_DATABASE_URL: postgresql://prisma_generate:unused@127.0.0.1:1/prisma_generate
          EXPERIENCE_DATABASE_URL: postgresql://prisma_generate:unused@127.0.0.1:1/prisma_generate
        run: |
          npm run prisma:iam:validate
          npm run prisma:iam:generate
          npm run prisma:commerce:validate
          npm run prisma:commerce:generate
          npm run prisma:operations:validate
          npm run prisma:operations:generate
          npm run prisma:experience:validate
          npm run prisma:experience:generate

      - name: Prisma migrate deploy (CI database only)
        run: npm run prisma:iam:migrate:deploy

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build applications
        run: |
          set -euo pipefail
          npm run build
          npm run build:iam
          npm run build:commerce
          npm run build:operations
          npm run build:experience
          test -f dist/apps/api-gateway/main.js
          test -f dist/apps/iam-service/main.js
          test -f dist/apps/commerce-service/main.js
          test -f dist/apps/operations-service/main.js
          test -f dist/apps/experience-service/main.js

      - name: Unit and IAM refresh regression tests
        run: npx jest --runInBand --testPathIgnorePatterns=live.spec.ts

      - name: Redis integration tests
        env:
          MEMORA_REDIS_TEST: '1'
        run: npx jest --runInBand --testPathPatterns=live.spec.ts

      - name: Build service images (linux/amd64, no push)
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -f docker/commerce-service.Dockerfile \
            -t memora-commerce-service:ci .
          docker build --platform linux/amd64 \
            -f docker/operations-service.Dockerfile \
            -t memora-operations-service:ci .
          docker build --platform linux/amd64 \
            -f docker/experience-service.Dockerfile \
            -t memora-experience-service:ci .

      - name: Verify service image structure
        run: |
          set -euo pipefail
          verify_image() {
            image="$1"
            service="$2"
            arch="$(docker image inspect "$image" --format '{{.Architecture}}')"
            user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            if [ "$arch" != "amd64" ]; then
              echo "FAIL ${image} architecture=${arch}" >&2
              exit 1
            fi
            if [ "$user" != "memora" ]; then
              echo "FAIL ${image} user=${user}" >&2
              exit 1
            fi
            docker run --rm --entrypoint sh "$image" -c "
              set -eu
              test \"\$(id -u)\" != 0
              test -f /app/dist/apps/${service}/main.js
              test -f /app/proto/grpc/health/v1/health.proto
              test -f /app/apps/${service}/generated/prisma/client.ts
              set -- /app/apps/${service}/generated/prisma/models/*.ts
              test -f \"\$1\"
              if [ -e /app/.env ] || [ -e /.env ]; then
                echo 'FAIL: .env present in image' >&2
                exit 1
              fi
              found=\$(find /app \\( -name '.env' -o -name '.env.*' -o -name 'credentials.json' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' \\) ! -name '.env.example' || true)
              if [ -n \"\$found\" ]; then
                echo 'FAIL: secret-like file present in image' >&2
                exit 1
              fi
              echo \"${service} image structure ok\"
            "
          }
          verify_image memora-commerce-service:ci commerce-service
          verify_image memora-operations-service:ci operations-service
          verify_image memora-experience-service:ci experience-service

      - name: Smoke test service images
        run: |
          set -euo pipefail
          cids=()
          cleanup() {
            local cid
            for cid in "${cids[@]}"; do
              docker rm -f "$cid" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT
          smoke() {
            local image="$1"
            local name="$2"
            local database_var="$3"
            local health_var="$4"
            local port="$5"
            local cid running live_code ready_code other_code ready_body ports
            cid="$(docker run -d --name "$name" \
              -e NODE_ENV=production \
              -e "${health_var}=0.0.0.0" \
              -e "${database_var}=postgresql://service_smoke:unused@127.0.0.1:1/memora" \
              -p "127.0.0.1:${port}:${port}" \
              "$image")"
            cids+=("$cid")
            live_code=""
            for _ in $(seq 1 20); do
              live_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:${port}/health/live" 2>/dev/null || true)"
              if [ "$live_code" = "200" ]; then
                break
              fi
              sleep 1
            done
            if [ "$live_code" != "200" ]; then
              echo "FAIL ${name} /health/live status=${live_code}" >&2
              docker logs "$cid" >&2 || true
              exit 1
            fi
            ready_body="$(mktemp)"
            ready_code="$(curl -sS -o "$ready_body" -w '%{http_code}' --max-time 15 "http://127.0.0.1:${port}/health/ready" || true)"
            if [ "$ready_code" != "503" ] || ! grep -q '"postgres":"down"' "$ready_body"; then
              echo "FAIL ${name} /health/ready status=${ready_code}" >&2
              docker logs "$cid" >&2 || true
              rm -f "$ready_body"
              exit 1
            fi
            rm -f "$ready_body"
            other_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:${port}/health/unknown" || true)"
            if [ "$other_code" != "404" ]; then
              echo "FAIL ${name} unexpected status=${other_code}" >&2
              exit 1
            fi
            running="$(docker inspect -f '{{.State.Running}}' "$cid")"
            if [ "$running" != "true" ]; then
              echo "FAIL ${name} exited after startup" >&2
              docker logs "$cid" >&2 || true
              exit 1
            fi
            ports="$(docker port "$cid")"
            if ! printf '%s\n' "$ports" | grep -q "127.0.0.1:${port}"; then
              echo "FAIL ${name} health port is not loopback" >&2
              exit 1
            fi
            if printf '%s\n' "$ports" | grep -Eq '0\.0\.0\.0|5005[2-4]'; then
              echo "FAIL ${name} published a non-loopback or gRPC port" >&2
              exit 1
            fi
            echo "${name} smoke ok live=200 ready=503"
          }
          smoke memora-commerce-service:ci memora-commerce-smoke COMMERCE_DATABASE_URL COMMERCE_HEALTH_HOST 5052
          smoke memora-operations-service:ci memora-operations-smoke OPERATIONS_DATABASE_URL OPERATIONS_HEALTH_HOST 5053
          smoke memora-experience-service:ci memora-experience-smoke EXPERIENCE_DATABASE_URL EXPERIENCE_HEALTH_HOST 5054

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Reject tracked secrets
        run: npm run ci:secrets

      - name: Production dependency audit
        run: npm run ci:audit

  publish:
    name: Publish GHCR (${{ matrix.app }})
    needs: [quality, security]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api-gateway
            image: memora-api-gateway
            file: docker/api-gateway.Dockerfile
          - app: iam-service
            image: memora-iam-service
            file: docker/iam-service.Dockerfile
          - app: iam-migrate
            image: memora-iam-migrate
            file: docker/iam-migrate.Dockerfile
          - app: commerce-service
            image: memora-commerce-service
            file: docker/commerce-service.Dockerfile
          - app: operations-service
            image: memora-operations-service
            file: docker/operations-service.Dockerfile
          - app: experience-service
            image: memora-experience-service
            file: docker/experience-service.Dockerfile
    env:
      TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR image (lowercase owner)
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64, no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Record local image identity
        run: |
          echo "image=${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect "${IMAGE}:${TAG}" --format 'id={{.Id}} size={{.Size}} os={{.Os}} arch={{.Architecture}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reject secrets inside image
        run: |
          docker run --rm --entrypoint sh "${IMAGE}:${TAG}" -c '
            set -eu
            if [ -e /app/.env ] || [ -e /.env ]; then
              echo "FAIL: .env present in image" >&2
              exit 1
            fi
            found="$(find /app -name ".env" -o -name ".env.*" -o -name "credentials.json" -o -name "*.pem" 2>/dev/null | grep -v ".env.example" || true)"
            if [ -n "$found" ]; then
              echo "FAIL: secret-like paths:" >&2
              echo "$found" >&2
              exit 1
            fi
            echo "no .env or credential files in /app"
          '

      - name: Verify Gateway entrypoint and live probe
        if: matrix.app == 'api-gateway'
        run: |
          docker run --rm --entrypoint sh "${IMAGE}:${TAG}" -c 'test -f /app/dist/apps/api-gateway/main.js && test -f /app/proto/iam/v1/iam.proto'
          cid="$(docker run -d --name memora-gw-smoke \
            -e NODE_ENV=production \
            -e API_GATEWAY_PORT=3000 \
            -e SWAGGER_ENABLED=false \
            -e IAM_GRPC_URL=iam-service:50051 \
            -e IAM_INTERNAL_GRPC_SECRET=0123456789abcdef0123456789abcdef \
            -p 127.0.0.1:3000:3000 \
            "${IMAGE}:${TAG}")"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health/live | grep -q '"ok"'; then
              echo "gateway live ok"
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid" >&2
          echo "gateway live probe failed" >&2
          exit 1

      - name: Verify IAM entrypoint and Prisma client
        if: matrix.app == 'iam-service'
        run: |
          docker run --rm --entrypoint sh "${IMAGE}:${TAG}" -c '
            set -eu
            test -f /app/dist/apps/iam-service/main.js
            test -f /app/proto/iam/v1/iam.proto
            test -f /app/proto/grpc/health/v1/health.proto
            test -f /app/apps/iam-service/generated/prisma/client.ts
            ls /app/apps/iam-service/generated/prisma >/dev/null
            echo "iam entrypoint and prisma client present"
          '

      - name: Verify migrate image Prisma CLI
        if: matrix.app == 'iam-migrate'
        run: |
          docker run --rm --entrypoint sh "${IMAGE}:${TAG}" -c '
            set -eu
            test -f /app/apps/iam-service/prisma/schema.prisma
            test -f /app/apps/iam-service/generated/prisma/client.ts
            npx prisma -v
            echo "migrate image ok"
          '

      - name: Verify service entrypoint and Prisma client
        if: matrix.app == 'commerce-service' || matrix.app == 'operations-service' || matrix.app == 'experience-service'
        run: |
          set -euo pipefail
          service="${{ matrix.app }}"
          case "$service" in
            commerce-service|operations-service|experience-service) ;;
            *)
              echo "FAIL unexpected publish app" >&2
              exit 1
              ;;
          esac
          arch="$(docker image inspect "${IMAGE}:${TAG}" --format '{{.Architecture}}')"
          user="$(docker image inspect "${IMAGE}:${TAG}" --format '{{.Config.User}}')"
          if [ "$arch" != "amd64" ]; then
            echo "FAIL ${service} architecture=${arch}" >&2
            exit 1
          fi
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "FAIL ${service} runs as root" >&2
            exit 1
          fi
          docker run --rm --entrypoint sh "${IMAGE}:${TAG}" -c "
            set -eu
            test \"\$(id -u)\" != 0
            test -f /app/dist/apps/${service}/main.js
            test -f /app/proto/grpc/health/v1/health.proto
            test -f /app/apps/${service}/generated/prisma/client.ts
            set -- /app/apps/${service}/generated/prisma/models/*.ts
            test -f \"\$1\"
            if [ -e /app/.env ] || [ -e /.env ]; then
              echo 'FAIL: .env present in image' >&2
              exit 1
            fi
            found=\$(find /app \\( -name '.env' -o -name '.env.*' -o -name 'credentials.json' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \\) ! -name '.env.example' || true)
            if [ -n \"\$found\" ]; then
              echo 'FAIL: secret-like file present in image' >&2
              exit 1
            fi
            echo \"${service} entrypoint and prisma client ok\"
          "

      - name: Scan image (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # Nested npm CLI inside the official Node image is not the app lockfile.
          skip-dirs: /usr/local/lib/node_modules/npm

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          load: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.app }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Publish digest
        run: |
          echo "digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "pushed ${IMAGE}:${TAG} digest=${{ steps.push.outputs.digest }} commit=${GITHUB_SHA}"

  deploy:
    name: Deploy Mini PC
    needs: [quality, security, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Refuse GitHub-hosted execution
        run: |
          if [[ "${RUNNER_NAME:-}" == "GitHub Actions"* ]] || [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]; then
            echo "Mini PC deploy must use the self-hosted runner" >&2
            exit 1
          fi

      - name: Deploy published SHA
        run: |
          set -euo pipefail
          sudo -n /opt/memora/bin/memora-deploy deploy \
            --release-sha "${GITHUB_SHA}" \
            --from-sha-tags \
            --confirm-migrate MIGRATE
