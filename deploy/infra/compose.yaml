name: memora-infra

# Arcane: Create Project name `memora-infra`, paste this file, add `.env` from
# deploy/infra/.env.example (real passwords + TAILSCALE_IPV4 + CLOUDFLARE_TUNNEL_TOKEN).
# Do not paste compose.local.yaml (laptop ports; it also skips cloudflared).
# Host ports bind only the Tailscale IP (not 0.0.0.0 / LAN). IAM still uses Docker DNS postgres/redis.
# Cloudflare Zero Trust public hostname origin: http://api-gateway:3000 (Docker DNS).
# Connector can run before Gateway exists; origin 502 until memora-backend is up.
# Stop a host systemd cloudflared using the same token (duplicate connector).
# Garage (S3-compatible object storage, D-P-08) holds fingerprint/audio sources.
# Containers use http://garage:3900. Only the S3 port is published, on the Tailscale IP
# (dev backend on a laptop); RPC 3901 and admin 3903 stay inside the container.
# Mosquitto (MQTT broker, D-P-07) talks to fingerprint capture devices and operations-service.
# Containers use mqtt://mosquitto:1883. Port 1883 is published only on the Tailscale IP. Devices outside the
# tailnet use MQTT over WebSocket: listener 9001 is NOT published on the host; Cloudflare Tunnel terminates TLS
# (public hostname e.g. mqtt.memora.style -> origin http://mosquitto:9001). Users come from this project's .env (MQTT_OPERATIONS_PASSWORD, MQTT_DEVICE_USERS); the
# container hashes them into /mosquitto/passwd on every start, so changing a user = edit .env + redeploy mosquitto.

networks:
  memora-network:
    name: memora-network
    driver: bridge

volumes:
  pgdata:
    name: memora-infra_pgdata
  redisdata:
    name: memora-infra_redisdata
  garagemeta:
    name: memora-infra_garagemeta
  garagedata:
    name: memora-infra_garagedata
  mosquittodata:
    name: memora-infra_mosquittodata

configs:
  garage_toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"
      metadata_auto_snapshot_interval = "6h"
      replication_factor = 1
      compression_level = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"

      [admin]
      api_bind_addr = "[::]:3903"
  mosquitto_conf:
    content: |
      listener 1883
      listener 9001
      protocol websockets
      allow_anonymous false
      password_file /mosquitto/passwd
      acl_file /mosquitto/config/acl
      persistence true
      persistence_location /mosquitto/data/
      message_size_limit 262144
      max_packet_size 262144
      log_dest stdout
      log_type error
      log_type warning
      log_type notice
      connection_messages true
  mosquitto_acl:
    content: |
      # Operations service: full access to the capture namespace.
      user memora-operations
      topic readwrite memora/capture/#

      # Devices: username = deviceCode. Each device only touches its own subtree.
      pattern write memora/capture/%u/attempts
      pattern write memora/capture/%u/hello
      pattern read memora/capture/%u/commands
      pattern read memora/capture/%u/results

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: memora-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-memora}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${TAILSCALE_IPV4:-100.78.222.34}:5432:5432'
    networks:
      memora-network:
        aliases:
          - postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    labels:
      com.memora.stack: infra
      com.memora.managed: 'true'

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: memora-redis
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    ports:
      - '${TAILSCALE_IPV4:-100.78.222.34}:6379:6379'
    networks:
      memora-network:
        aliases:
          - redis
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    labels:
      com.memora.stack: infra
      com.memora.managed: 'true'

  garage:
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.5.0}
    container_name: memora-garage
    restart: unless-stopped
    stop_grace_period: 20s
    # --single-node builds the one-node layout; --default-bucket creates the bucket and
    # the access key from GARAGE_DEFAULT_* on start (idempotent).
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:-memora-personalization}
    configs:
      - source: garage_toml
        target: /etc/garage.toml
    volumes:
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    ports:
      - '${TAILSCALE_IPV4:-100.78.222.34}:3900:3900'
    networks:
      memora-network:
        aliases:
          - garage
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    labels:
      com.memora.stack: infra
      com.memora.managed: 'true'

  mosquitto:
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2.0.21}
    container_name: memora-mosquitto
    restart: unless-stopped
    stop_grace_period: 20s
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
      - source: mosquitto_acl
        target: /mosquitto/config/acl
        uid: '1883'
        gid: '1883'
        mode: 0400
    environment:
      # memora-operations password, and device users as `deviceCode:password,deviceCode:password`.
      MQTT_OPERATIONS_PASSWORD: ${MQTT_OPERATIONS_PASSWORD}
      MQTT_DEVICE_USERS: ${MQTT_DEVICE_USERS:-}
    # Build the password file from env (hashed, mode 600, owned by the broker user), then run the broker.
    # `mosquitto_passwd -c` recreates the file, so removed users disappear on restart.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        [ "$${#MQTT_OPERATIONS_PASSWORD}" -ge 16 ] || { echo 'MQTT_OPERATIONS_PASSWORD must be >= 16 chars' >&2; exit 1; }
        umask 077
        mosquitto_passwd -c -b /mosquitto/passwd memora-operations "$$MQTT_OPERATIONS_PASSWORD"
        for pair in $$(echo "$$MQTT_DEVICE_USERS" | tr ',' ' '); do
          user="$${pair%%:*}"; pass="$${pair#*:}"
          case "$$user" in memora-operations|''|*[!A-Za-z0-9_-]*) echo "invalid device user: $$user" >&2; exit 1;; esac
          [ "$${#pass}" -ge 16 ] || { echo "password for $$user must be >= 16 chars" >&2; exit 1; }
          mosquitto_passwd -b /mosquitto/passwd "$$user" "$$pass"
        done
        chown mosquitto:mosquitto /mosquitto/passwd
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - mosquittodata:/mosquitto/data
    ports:
      - '${TAILSCALE_IPV4:-100.78.222.34}:1883:1883'
    networks:
      memora-network:
        aliases:
          - mosquitto
    # TCP-level check only: authenticated checks would need a secret in the container.
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 1883']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    labels:
      com.memora.stack: infra
      com.memora.managed: 'true'

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.0}
    container_name: memora-cloudflared
    restart: unless-stopped
    stop_grace_period: 15s
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      memora-network:
        aliases:
          - cloudflared
    healthcheck:
      test: ['CMD', 'cloudflared', '--version']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    labels:
      com.memora.stack: infra
      com.memora.managed: 'true'
